<!--
  **아주 작은 크기(16pt)용 변형.** `build/icon.svg` 와 같은 그림이되 줄이 두 개다.

  왜 따로 두는가: 16px 에서는 쓸 수 있는 세로 픽셀이 열 개 남짓이라 줄 세 개와
  틈 두 개가 들어가지 못하고 **한 덩어리로 뭉친다**(실측). 맥의 목록·메뉴와
  윈도우 작업표시줄이 이 크기를 쓴다 — 사람이 가장 자주 보는 크기다.

  줄을 하나 줄이고 두껍게 하면 같은 인상(가운데 정렬된 가사)을 유지하면서 읽힌다.
  애플·마이크로소프트 지침도 작은 크기에서는 요소를 덜어내라고 한다.

  큰 아이콘을 고치면 **이 파일도 함께 고친다** — 둘이 어긋나면 크기에 따라
  다른 앱처럼 보인다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2B45"/>
      <stop offset="1" stop-color="#0A0E15"/>
    </linearGradient>
  </defs>

  <rect x="60" y="60" width="904" height="904" rx="203" ry="203" fill="url(#bg)"/>

  <!--
    두 줄. 덩어리(297~727)의 한가운데가 캔버스 한가운데(512)에 온다.

    **크기를 픽셀로 환산해 정한다.** 16px 로 줄이면 1픽셀 = 64 단위다.
    줄 두께 150(≈2.3px) · 틈 130(≈2px) — 이만큼 벌려야 두 줄로 보인다.
    처음엔 두께 96 · 틈 12 로 두었다가 통째로 뭉쳤다(실측).
  -->
  <g fill="#FFFFFF">
    <rect x="230" y="297" width="564" height="150" rx="75"/>
    <rect x="330" y="577" width="364" height="150" rx="75"/>
  </g>
</svg>
