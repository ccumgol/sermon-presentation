<!--
  앱 아이콘 원본. 여기만 고치면 맥·윈도우 아이콘이 다시 만들어진다
  (`npm run icons`).

  ## 무엇을 그리는가

  **어두운 화면에 가운데 정렬된 흰 줄 세 개** — 이 앱이 실제로 벽에 띄우는 모양이다.
  프로젝터 PWA 아이콘(`public/projector/icon-512.png`)이 이미 쓰던 정체성을
  그대로 이어받았다. 둘이 따로 놀면 같은 앱으로 보이지 않는다.

  줄 길이를 다르게 둔 이유: 같은 길이로 그리면 메뉴 아이콘(햄버거)처럼 보인다.
  가운데가 길고 위아래가 짧은 것은 **가사 한 절이 가운데 정렬된 모습**이다.

  ## 맥 규격

  맥은 아이콘 모서리를 깎아 주지 않는다 — **아이콘이 스스로 둥근 사각형을 그려야
  한다.** Apple 격자 기준으로 1024 캔버스에서 사각형은 824×824(사방 100 여백),
  모서리 반경은 185.4 다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 짙은 남색 — 앱의 다크 테마(#0e1116)와 같은 계열이되, 독에서 다른 검은
         아이콘과 구별되도록 푸른 기를 남긴다 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2B45"/>
      <stop offset="1" stop-color="#0A0E15"/>
    </linearGradient>

    <!-- 글자 뒤의 옅은 빛 — '비춘다' 는 느낌. 작은 크기에서는 사라져도 무방하다 -->
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4" fill="url(#glow)"/>

  <!-- 가사 세 줄. 모서리를 완전히 둥글려(rx = 높이/2) 붓끝처럼 부드럽게.
       세 줄 덩어리(355~669)의 한가운데가 캔버스 한가운데(512)에 오도록 맞췄다 —
       처음엔 38px 아래로 처져 보였다.

       줄 두께(66)보다 **틈(58)을 넉넉히** 둔다. 처음에는 두께 76 · 틈 40 이었는데
       16px 로 줄이면 틈이 0.6px 이 되어 **세 줄이 한 덩어리로 뭉쳤다**(실측).
       16px 은 맥의 목록·메뉴와 윈도우 작업표시줄이 쓰는 크기라 그냥 넘길 수 없다. -->
  <g fill="#FFFFFF">
    <rect x="286" y="355" width="452" height="66" rx="33"/>
    <rect x="222" y="479" width="580" height="66" rx="33"/>
    <rect x="330" y="603" width="364" height="66" rx="33"/>
  </g>
</svg>
