# 맥·윈도우 배포 포장 (Phase 6).
#
# ## 무엇이 앱 안에 들어가는가
#
# 코드와 화면만 들어간다. **가사·성경·악보는 들어가지 않는다** — 저작권 자료라
# git 에 없고(`data/` 는 gitignore), 앱에 넣으면 배포판이 그것을 나르게 된다.
#
# 봉사자 PC 로 넘기는 길은 **두 갈래다** (점검 P-3):
#   · 설정 탭 '자료 가져오기' (번들 JSON) — 가사·곡집·교독문·템플릿·순서·설정·폰트,
#     그리고 악보의 단 경계·검토 판정
#   · **폴더 복사** — `bible.sqlite`(약 100MB)와 `sheets/` 그림(약 50MB).
#     파일 하나에 담기엔 너무 커서 데이터 폴더에 직접 넣는다 (README '설치판으로 쓰기')
#
# ## `asar: false` 인 이유
#
# 서버가 `public/` 의 파일을 정적으로 서빙한다. asar 로 묶으면 그 경로가 가상
# 파일시스템이 되어 `@fastify/static` 이 읽지 못한다. 압축을 포기하는 대신
# 구조가 단순해지고, 문제가 생겼을 때 앱 안을 직접 열어 볼 수 있다.
appId: org.jiwumission.sermon-presentation

# ## 왜 이름이 영문인가 — 겪은 것 (2026-09-05)
#
# `productName` 은 **파일·번들 이름**이 된다 — `.app`, 실행 파일, 그리고
# **Helper 앱들**(`<이름> Helper.app`). Electron 은 뜰 때 그 이름으로 Helper 를
# 찾는데, 한글·공백이 든 이름(`예배 프레젠테이션`)이면 찾지 못하고
# `FATAL ... Unable to find helper app` 으로 죽는다.
#
# 겉으로는 **창도 로그도 없이 종료 코드 133(SIGTRAP)** 만 남아 원인을 찾기 어려웠다.
# 최소 코드로도 죽는 것을 보고 번들 문제로 좁혔고, 이름을 영문으로 바꿔 확인했다.
#
# 사람이 보는 이름은 아래 `CFBundleDisplayName` 이 정한다 — Finder·독에는 한글로
# 보이고, 파일 이름만 영문이다.
productName: SermonPresentation
copyright: Copyright © 2026 지우선교회

# ## 파일 이름의 판 표기 (2026-09-12 사용자 결정)
#
# `${version}` 은 semver(`1.4.0`)다. 사람에게 보여 줄 것은 `1.04` 인데 semver 는
# 앞자리 0 을 금지해서(`1.04.0` 은 규격 위반) 저장과 표기가 갈렸다.
#
# `DISPLAY_VERSION` 은 **`scripts/dist.ts` 가 `package.json` 에서 계산해** 넘긴다 —
# 어딘가에 따로 적어 두면 판을 올릴 때 한쪽만 고쳐 어긋난다.
#
# ⚠️ `electron-builder` 를 **직접** 부르면 이 값이 비어 파일 이름이 `--arm64.dmg`
# 처럼 된다. 반드시 `npm run dist:mac` · `dist:win` 으로 부른다.
artifactName: ${productName}-${env.DISPLAY_VERSION}-${arch}.${ext}

directories:
  output: release
  # `build/` 가 아니라 `build-resources/` 인 이유: `.gitignore` 가 `build/` 를
  # 산출물로 보고 무시한다. 아이콘은 **저장소에 있어야** CI(윈도우 빌드)가 쓴다.
  buildResources: build-resources

# asar 을 쓰지 않으므로 남아 있는 무결성 항목을 빌드 뒤에 지운다 —
# 그것이 없는 파일을 가리켜 앱이 뜨자마자 죽는다 (electron/after-pack.cjs 머리말).
asar: false
afterPack: electron/after-pack.cjs

# `resources/app/` 아래로 그대로 복사된다. electron/main.js 의 APP_ROOT 와 짝이다 —
# 한쪽만 바꾸면 앱이 자기 파일을 찾지 못한다.
extraResources:
  - from: dist-server
    to: app/dist-server
  - from: public
    to: app/public
  - from: package.json
    to: app/package.json

files:
  - electron/**/*
  - package.json

mac:
  category: public.app-category.productivity
  # build/ 가 buildResources 라 이름만 맞으면 자동으로 집어 가지만, 어느 파일이
  # 아이콘인지 여기 적어 두는 편이 찾기 쉽다. 만드는 법은 `npm run icons`
  icon: build-resources/icon.icns
  # Finder·독에 보이는 이름. **`CFBundleName` 은 건드리지 않는다** —
  # Electron 이 그 이름으로 Helper 앱을 찾는다. 덮어쓰면
  # 'Unable to find helper app' 으로 앱이 뜨지 않는다 (실제로 겪었다).
  extendInfo:
    CFBundleDisplayName: 예배 프레젠테이션
  target:
    - target: dmg
      arch: [arm64, x64]
  # 인증서로는 서명하지 않는다 (Apple 개발자 계정이 있어야 한다).
  # 대신 `electron/after-pack.cjs` 가 **애드혹 서명**을 하고 검증까지 한다 —
  # 없으면 다른 맥에서 '손상되었기 때문에 열 수 없습니다' 로 막힌다 (2026-09-05).
  #
  # ⚠️ 받는 사람 안내는 **'마우스 오른쪽 → 열기' 가 아니다.** 그 방법은 '확인되지
  # 않은 개발자' 일 때 쓰는 것이고 이 경우에는 듣지 않는다. 실제로 듣는 방법은
  # 격리 표시를 지우는 것이다:  xattr -dr com.apple.quarantine <앱>
  # 안내는 README '설치판으로 쓰기' 와 docs/TROUBLESHOOTING 2.4.16 에 있다.
  identity: null

# ## DMG 안에 **첫 실행 준비 스크립트**를 함께 넣는다 (2026-09-10, 사용자 요청)
#
# 공증을 받지 않았으므로 받는 사람은 **한 번** 격리 표시를 지워야 한다. 그동안은
# README 를 읽고 터미널에 명령을 붙여넣게 했는데, 봉사자에게는 그 자체가 벽이다.
#
# **앱이 스스로 할 수는 없다** — 막는 시점이 앱이 뜨기 **전**이라 앱 안의 코드는
# 한 줄도 돌지 않는다. 그래서 앱 바깥에서 도는 것이 있어야 하고, 그것이 이 스크립트다.
#
# ⚠️ **창 안의 세로 배치는 여기서 정해지지 않는다** (2026-09-10 실측).
# 두 파일을 위로 올리려고 y 를 190↔350 으로 뒤집어 다시 만들어 봤지만 **배치가
# 그대로였다** — 스크립트·안내문이 위, 앱→응용 프로그램이 아래로 나온다.
# (Finder 가 자체 정렬을 쓰는 것으로 보인다. 원인까지는 파고들지 않았다.)
#
# 그래서 **순서는 파일 이름으로 알린다** — '먼저 읽어보세요.txt'. 안내문 첫 줄도
# '응용 프로그램으로 끌어다 놓습니다' 로 시작한다.
# 고칠 일이 있으면 짐작하지 말고 DMG 를 열어 눈으로 확인할 것.
dmg:
  window:
    width: 620
    height: 480
  contents:
    - x: 165
      y: 330
      type: file
    - x: 455
      y: 330
      type: link
      path: /Applications
    - x: 165
      y: 170
      type: file
      path: build-resources/mac-first-run.command
      name: 맥에서 처음 열기.command
    # 스크립트도 macOS 가 한 번 막을 수 있다(2026-09-10 실측). 그때 **읽고 붙여넣을**
    # 것이 창 안에 있어야 한다 — 텍스트 파일은 막히지 않는다.
    - x: 455
      y: 170
      type: file
      path: build-resources/mac-readme.txt
      name: 먼저 읽어보세요.txt

win:
  icon: build-resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  # 설치 중에 OBS·Chrome 도 함께 깔 수 있게 한다 (2026-09-10, 사용자 요청).
  # 물어보는 화면과 winget 호출이 그 안에 있고, **실패해도 설치는 끝난다.**
  # ⚠️ 그 스크립트는 실행해 본 적이 없다 — 만든 사람에게 윈도우가 없다.
  #    CI 는 **컴파일되는 것까지만** 확인해 준다. 머리말 참고.
  include: build-resources/installer.nsh
  oneClick: false
  # 관리자 권한 없이 설치할 수 있게 한다. 교회 PC 는 관리자 계정이 아닐 때가 많다
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 예배 프레젠테이션
